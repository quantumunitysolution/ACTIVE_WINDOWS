<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Electron App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: sans-serif; padding-top: 18px; }
    /* Chart sizing helpers to keep UI compact */
    .chart-card { height: 400px; }
    .chart-card canvas { width: 100% !important; height: 100% !important; }
    .medium-chart { height: 300px !important; }
    .small-chart { height: 300px !important; }
    .table-wrap { max-height: 320px; overflow: auto; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Live Activity</h1>
      <div>
        <button id="pingBtn" class="btn btn-outline-secondary btn-sm me-2">Ping Main</button>
        <span id="response" class="text-muted small"></span>
      </div>
    </div>

    <div id="liveSection" class="card">
      <div class="card-body">
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item" role="presentation"><button id="tabChart" class="nav-link active" type="button" role="tab">Chart</button></li>
          <li class="nav-item" role="presentation"><button id="tabCurrent" class="nav-link" type="button" role="tab">Current Tab</button></li>
          <li class="nav-item" role="presentation"><button id="tabAll" class="nav-link" type="button" role="tab">All Data</button></li>
        </ul>

        <div class="tab-content mt-3">
          <div id="chartSection" class="tab-pane fade show active">
            <div class="chart-card" style="position:relative;">
              <canvas id="liveChart" class="medium-chart"></canvas>
            </div>

            <div class="row mt-3">
              <div class="col-md-6">
                <div class="card mb-3">
                  <div class="card-body">
                    <h6 class="card-title">Top Domains (distribution)</h6>
                    <canvas id="domainDoughnut" class="small-chart"></canvas>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card mb-3">
                  <div class="card-body">
                    <h6 class="card-title">Average Match Score (per domain)</h6>
                    <canvas id="avgScoreBar" class="small-chart"></canvas>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-12">
                <div class="card">
                  <div class="card-body">
                    <h6 class="card-title">Average Memory Usage (MB by domain)</h6>
                    <canvas id="memoryBar" class="small-chart"></canvas>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div id="currentSection" class="tab-pane fade">
            <div class="mt-2">
              <div id="currentDetails" class="card">
                <div class="card-body">
                  <h5 id="currentTitle" class="card-title">No active tab</h5>
                  <p id="currentProfile" class="card-text small text-muted"></p>
                  <p id="currentDomain" class="card-text"></p>
                  <p id="currentMatched" class="card-text"></p>
                  <p id="currentMemory" class="card-text"></p>
                  <div id="currentActions"></div>
                </div>
              </div>
            </div>
          </div>

          <div id="allSection" class="tab-pane fade">
            <div class="table-wrap mt-2">
              <table class="table table-striped table-hover table-sm">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Profile</th>
                    <th>App Title</th>
                    <th>Domain</th>
                    <th>Matched Title</th>
                    <th>URL</th>
                    <th>Score</th>
                    <th>Memory (MB)</th>
                  </tr>
                </thead>
                <tbody id="liveTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart.js and Bootstrap JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="./render.js"></script>
</body>
</html>
