<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Electron App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: sans-serif; padding-top: 18px; }
    /* Chart sizing helpers to keep UI compact */
    .liveSection { height: fit-content; }
    .chart-card { height: 400px; }
    .chart-card canvas { width: 100% !important; height: 100% !important; }
    .medium-chart { height: 300px !important; }
    .small-chart { height: 300px !important; }
    .table-wrap { max-height: 320px; overflow: auto; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Live Activity</h1>
      <div>
        <button id="pingBtn" class="btn btn-outline-secondary btn-sm me-2">Ping Main</button>
        <span id="response" class="text-muted small"></span>
      </div>
    </div>

    <!-- Activity Summary Section -->
    <div class="row mb-3">
      <div class="col-md-4">
        <div class="card bg-light">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted">Current Application</h6>
            <h5 class="card-title mb-0" id="currentAppName">-</h5>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-light">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted">Current URL</h6>
            <h5 class="card-title text-truncate mb-0" id="currentUrl">-</h5>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-light">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted">Current Profile</h6>
            <h5 class="card-title mb-0" id="currentProfileName">-</h5>
          </div>
        </div>
      </div>
    </div>

    <div id="liveSection" class="card">
      <div class="card-body">
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item" role="presentation"><button id="tabChart" class="nav-link active" type="button" role="tab">Chart</button></li>
          <li class="nav-item" role="presentation"><button id="tabCurrent" class="nav-link" type="button" role="tab">Current Tab</button></li>
          <li class="nav-item" role="presentation"><button id="tabAll" class="nav-link" type="button" role="tab">All Data</button></li>
        </ul>

        <div class="tab-content mt-3">
          <div id="chartSection" class="tab-pane fade show active">
            <div class="chart-card" style="position:relative;">
              <canvas id="liveChart" class="medium-chart"></canvas>
            </div>

            <div class="row mt-3">
              <div class="col-md-6">
                <div class="card mb-3">
                  <div class="card-body">
                    <h6 class="card-title">Top Domains (distribution)</h6>
                    <canvas id="domainDoughnut" class="small-chart"></canvas>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div id="currentSection" class="tab-pane fade">
            <div class="mt-2">
              <div id="currentDetails" class="card">
                <div class="card-body">
                  <h5 id="currentTitle" class="card-title">No active tab</h5>
                  <p id="currentProfile" class="card-text small text-muted"></p>
                  <p id="currentDomain" class="card-text"></p>
                  <p id="currentMatched" class="card-text"></p>
                  <p id="currentMemory" class="card-text"></p>
                  <div id="currentActions"></div>
                </div>
              </div>
            </div>
          </div>

          <div id="allSection" class="tab-pane fade">
            <div class="table-wrap mt-2">
              <table class="table table-striped table-hover table-sm">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Profile</th>
                    <th>App Title</th>
                    <th>Domain</th>
                    <th>Matched Title</th>
                    <th>URL</th>
                    <th>Score</th>
                    <th>Memory (MB)</th>
                  </tr>
                </thead>
                <tbody id="liveTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Logs Section -->
    <div class="card mt-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Activity Logs</h5>
        <div>
          <button id="clearLogs" class="btn btn-outline-danger btn-sm">Clear Logs</button>
          <button id="exportLogs" class="btn btn-outline-primary btn-sm ms-2">Export CSV</button>
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover table-striped">
            <thead class="table-light">
              <tr>
                <th>Timestamp</th>
                <th>Profile</th>
                <th>Application</th>
                <th>URL</th>
                <th>Match Score</th>
                <th>Memory (MB)</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="logsTableBody">
              <!-- Logs will be populated here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart.js and Bootstrap JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="./render.js"></script>
</body>
</html>
